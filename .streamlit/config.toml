# WAVYMIXING brand theme — studio dark, matching wavymixing.com
# To fine-tune: primaryColor is the accent used for buttons, meters and links.
[theme]
base = "dark"
primaryColor = "#F0A93B"
backgroundColor = "#0A0A0C"
secondaryBackgroundColor = "#151518"
textColor = "#F4F2ED"
 
[browser]
gatherUsageStats = false
 
